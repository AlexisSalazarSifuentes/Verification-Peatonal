<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Inspección Aleatoria</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2563eb">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Inspección">

<style>
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    -webkit-user-select: none;
    -moz-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: #f4f5f7;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #222;
    padding: 20px;
  }
  h1 {
    font-size: 60px;
    font-weight: 700;
    text-align: center;
    margin-top: 0;
    margin-bottom: 14px;
    text-transform: uppercase;
  }
  .subtitle {
    text-align: center;
    color: #666;
    font-size: 34px;
    margin-bottom: 24px;
    text-transform: uppercase;
  }
  .prob-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 24px;
    color: #999;
    font-size: 36px;
  }
  .prob-row .prob-fixed {
    font-weight: 700;
    color: #666;
  }
  button.check {
    width: 400px;
    height: 400px;
    min-width: 400px;
    min-height: 400px;
    flex-shrink: 0;
    border-radius: 50%;
    border: none;
    background: #2563eb;
    color: #fff;
    font-size: 40px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 8px 28px rgba(37,99,235,0.35);
    transition: transform 0.08s;
  }
  button.check:active { transform: scale(0.96); }
  button.check:disabled {
    background: #93c5fd;
    cursor: not-allowed;
    box-shadow: none;
  }
  button.check.hidden {
    display: none;
  }
  .result {
    flex-shrink: 0;
    margin-bottom: 40px;
    text-align: center;
    font-size: 90px;
    font-weight: 800;
    padding: 200px 60px;
    border-radius: 32px;
    min-width: 800px;
    width: 95vw;
    max-width: 1100px;
    display: none;
  }
  .result.show { display: block; }
  .result.si { background: #f87171; color: #7f1d1d; font-size: 90px; }
  .result.no { background: #4ade80; color: #14532d; font-size: 90px; }
</style>
</head>
<body>
  <h1>Inspección Aleatoria</h1>
  <div class="subtitle">Verificación de personas</div>
  <div class="prob-row">
    <span>Probabilidad:</span>
    <span class="prob-fixed" id="probFixed">20%</span>
  </div>
  <div class="result" id="resPersona">&nbsp;</div>
  <button class="check" id="btnVerificar" onclick="evaluar()">VERIFICAR</button>
<script>
  const PROBABILIDAD = 20; // % fijo, editar aquí para cambiar
  document.getElementById('probFixed').textContent = PROBABILIDAD + '%';
  function evaluar() {
    const btn = document.getElementById('btnVerificar');
    const resDiv = document.getElementById('resPersona');
    btn.disabled = true;
    btn.classList.add('hidden');
    const roll = Math.random() * 100;
    const inspeccionado = roll < PROBABILIDAD;
    resDiv.textContent = inspeccionado ? 'GRACIAS POR SU COOPERACION' : 'FELIZ REGRESO A CASA';
    resDiv.className = 'result show ' + (inspeccionado ? 'si' : 'no');
    setTimeout(() => {
      resDiv.textContent = '\u00A0';
      resDiv.className = 'result';
      btn.disabled = false;
      btn.classList.remove('hidden');
    }, 800);
  }

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js');
    });
  }

  document.addEventListener('contextmenu', (e) => e.preventDefault());
  document.addEventListener('selectstart', (e) => e.preventDefault());
  document.addEventListener('dragstart', (e) => e.preventDefault());
</script>
</body>
</html>
