<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inspección Aleatoria</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: #f4f5f7;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    color: #222;
    padding: 20px;
    padding-top: 30px;
  }
  h1 {
    font-size: 60px;
    font-weight: 700;
    text-align: center;
    margin-top: 0;
    margin-bottom: 14px;
    text-transform: uppercase;
  }
  .subtitle {
    text-align: center;
    color: #666;
    font-size: 34px;
    margin-bottom: 24px;
    text-transform: uppercase;
  }
  .prob-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 24px;
    color: #999;
    font-size: 36px;
  }
  .prob-row .prob-fixed {
    font-weight: 700;
    color: #666;
  }

  button.check {
    width: 200px;
    height: 200px;
    border-radius: 50%;
    border: none;
    background: #2563eb;
    color: #fff;
    font-size: 24px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 8px 28px rgba(37,99,235,0.35);
    transition: transform 0.08s;
  }
  button.check:active { transform: scale(0.96); }
  button.check:disabled {
    background: #93c5fd;
    cursor: not-allowed;
    box-shadow: none;
  }

  .result {
    margin-bottom: 40px;
    text-align: center;
    font-size: 90px;
    font-weight: 800;
    padding: 200px 60px;
    border-radius: 32px;
    min-width: 800px;
    width: 95vw;
    max-width: 1100px;
    visibility: hidden;
  }
  .result.show { visibility: visible; }
  .result.si { background: #f87171; color: #7f1d1d; font-size: 90px; }
  .result.no { background: #4ade80; color: #14532d; font-size: 90px; }
</style>
</head>
<body>
  <h1>Inspección Aleatoria</h1>
  <div class="subtitle">Verificación de personas</div>

  <div class="prob-row">
    <span>Probabilidad:</span>
    <span class="prob-fixed" id="probFixed">20%</span>
  </div>

  <div class="result" id="resPersona">&nbsp;</div>

  <button class="check" id="btnVerificar" onclick="evaluar()">VERIFICAR</button>

<script>
  const PROBABILIDAD = 20; // % fijo, editar aquí para cambiar

  document.getElementById('probFixed').textContent = PROBABILIDAD + '%';

  function evaluar() {
    const btn = document.getElementById('btnVerificar');
    const resDiv = document.getElementById('resPersona');

    btn.disabled = true;

    const roll = Math.random() * 100;
    const inspeccionado = roll < PROBABILIDAD;

    resDiv.textContent = inspeccionado ? 'SÍ INSPECCIONA' : 'NO INSPECCIONA';
    resDiv.className = 'result show ' + (inspeccionado ? 'si' : 'no');

    setTimeout(() => {
      resDiv.textContent = '\u00A0';
      resDiv.className = 'result';
      btn.disabled = false;
    }, 3000);
  }
</script>
</body>
</html>
